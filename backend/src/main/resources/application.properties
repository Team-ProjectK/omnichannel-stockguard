spring.application.name=backend

server.port=${PORT:8081}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# OpenRouter AI Configuration
ai.provider=${AI_PROVIDER:openrouter}
ai.model=${AI_MODEL:google/gemini-2.5-flash}
ai.temperature=${AI_TEMPERATURE:0.4}
ai.maxTokens=${AI_MAX_TOKENS:2048}

openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.api.key=${OPENROUTER_API_KEY}