<div class="floating-chat-wrapper">
  <!-- Floating Action Button -->
  <button 
    class="chat-trigger-btn" 
    [class.active]="isOpen"
    (click)="toggleChat()" 
    mat-fab 
    color="primary"
    aria-label="Open AI Assistant">
    <mat-icon *ngIf="!isOpen">smart_toy</mat-icon>
    <mat-icon *ngIf="isOpen">close</mat-icon>
    <span class="badge" *ngIf="!isOpen && unreadBadgeCount > 0">{{ unreadBadgeCount }}</span>
  </button>

  <!-- Chat Drawer / Window -->
  <div class="chat-window" [class.open]="isOpen">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-info">
        <div class="ai-avatar">
          <mat-icon>auto_awesome</mat-icon>
        </div>
        <div>
          <h3 class="header-title">StockGuard AI Assistant</h3>
          <span class="header-status">
            <span class="status-dot"></span> OpenRouter Gemini 2.5 Flash
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button mat-icon-button (click)="clearChat()" title="Clear Chat History">
          <mat-icon>delete_outline</mat-icon>
        </button>
        <button mat-icon-button (click)="toggleChat()" title="Close">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="chat-messages" #chatScrollContainer>
      <div 
        *ngFor="let msg of messages; let i = index" 
        class="message-row"
        [class.user-row]="msg.sender === 'user'"
        [class.ai-row]="msg.sender === 'ai'">
        
        <div class="msg-avatar" *ngIf="msg.sender === 'ai'">
          <mat-icon>smart_toy</mat-icon>
        </div>

        <div class="msg-bubble-container">
          <div class="msg-bubble">
            <div class="msg-text">{{ msg.text }}</div>
            <div class="msg-footer">
              <span class="msg-time">{{ msg.timestamp | date:'shortTime' }}</span>
              <button 
                *ngIf="msg.sender === 'ai'"
                class="copy-btn" 
                (click)="copyToClipboard(msg.text, i)" 
                title="Copy response">
                <mat-icon>{{ copiedIndex === i ? 'check' : 'content_copy' }}</mat-icon>
                <span>{{ copiedIndex === i ? 'Copied' : '' }}</span>
              </button>
            </div>
          </div>
        </div>

        <div class="msg-avatar user-avatar" *ngIf="msg.sender === 'user'">
          <mat-icon>person</mat-icon>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="message-row ai-row" *ngIf="isLoading">
        <div class="msg-avatar">
          <mat-icon>smart_toy</mat-icon>
        </div>
        <div class="msg-bubble typing-bubble">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="typing-text">Analyzing database...</span>
        </div>
      </div>
    </div>

    <!-- Quick Prompts Chips -->
    <div class="quick-prompts-container" *ngIf="!isLoading">
      <div 
        *ngFor="let prompt of quickPrompts" 
        class="prompt-chip" 
        (click)="sendQuickPrompt(prompt)">
        <mat-icon>bolt</mat-icon>
        <span>{{ prompt }}</span>
      </div>
    </div>

    <!-- Input Box -->
    <div class="chat-input-area">
      <textarea 
        class="chat-textarea"
        placeholder="Ask about low stock, orders, reordering..." 
        [(ngModel)]="userInput"
        (keydown)="onKeyDown($event)"
        [disabled]="isLoading"
        rows="1">
      </textarea>
      <button 
        class="send-btn" 
        mat-icon-button 
        color="primary"
        (click)="sendMessage()" 
        [disabled]="!userInput.trim() || isLoading">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
</div>
