<header class="navbar">

    <div class="left-section">
        <h2>Omnichannel StockGuard</h2>
        <p>{{ today | date:'EEEE, dd MMMM yyyy' }}</p>
    </div>

    <div class="right-section">

        <div class="search-box">
            <mat-icon>search</mat-icon>
            <input
                type="text"
                placeholder="Search products, orders, inventory..."
            >
        </div>

        <button mat-icon-button (click)="goToNotifications()" matTooltip="Notifications">
            <mat-icon [matBadge]="unreadCount" matBadgeColor="warn" [matBadgeHidden]="unreadCount === 0">notifications</mat-icon>
        </button>

        <button mat-icon-button (click)="toggleTheme()" matTooltip="Toggle Dark Mode">
            <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <!-- Professional Profile Dropdown Trigger -->
        <div class="profile-trigger" [matMenuTriggerFor]="profileMenu" matTooltip="User Account" *ngIf="currentUser">
            <div class="avatar">{{ currentUser.name.charAt(0).toUpperCase() }}</div>
            <div class="profile-info">
                <h4>{{ currentUser.name }}</h4>
                <small>{{ currentUser.role }}</small>
            </div>
            <mat-icon class="chevron">expand_more</mat-icon>
        </div>

        <!-- Material Profile Menu -->
        <mat-menu #profileMenu="matMenu" xPosition="before" class="profile-dropdown-panel">
            <div class="dropdown-header" *ngIf="currentUser">
                <div class="avatar-lg">{{ currentUser.name.charAt(0).toUpperCase() }}</div>
                <div class="user-details">
                    <strong>{{ currentUser.name }}</strong>
                    <small>{{ currentUser.email }}</small>
                    <span class="role-chip">{{ currentUser.role }}</span>
                </div>
            </div>

            <mat-divider></mat-divider>

            <button mat-menu-item (click)="goToProfile()">
                <mat-icon color="primary">account_circle</mat-icon>
                <span>View User Profile</span>
            </button>

            <button mat-menu-item (click)="goToSettings()">
                <mat-icon color="primary">settings</mat-icon>
                <span>Account Settings</span>
            </button>

            <button mat-menu-item (click)="toggleTheme()">
                <mat-icon color="primary">{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
                <span>Switch to {{ isDark ? 'Light' : 'Dark' }} Mode</span>
            </button>

            <mat-divider></mat-divider>

            <button mat-menu-item (click)="logout()">
                <mat-icon color="warn">logout</mat-icon>
                <span class="text-warn">Sign Out</span>
            </button>
        </mat-menu>

    </div>

</header>
