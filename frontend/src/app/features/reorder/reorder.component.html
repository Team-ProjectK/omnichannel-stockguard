<div class="reorder-container animate-fade-in">
  <div class="header-section">
    <div>
      <h2>Automated Reorder Engine</h2>
      <p class="subtitle">Review reorder requests submitted to the backend REST API.</p>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="cards-grid">
    <app-summary-card title="Total Reorder Requests" [value]="dataSource.data.length" subtitle="In system" icon="warning" color="orange"></app-summary-card>
  </div>

  <!-- Filter & Search Toolbar -->
  <div class="filter-card">
    <div class="filter-row">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search Reorder Requests</mat-label>
        <input matInput (keyup)="applySearch($event)" placeholder="Search by SKU, store ID, supplier, or status">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
  </div>

  <!-- Reorder Table -->
  <div class="table-card mat-elevation-z1">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="sku">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>SKU</th>
        <td mat-cell *matCellDef="let element" class="font-mono">{{ element.sku }}</td>
      </ng-container>

      <ng-container matColumnDef="storeId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Store ID</th>
        <td mat-cell *matCellDef="let element" class="font-bold">{{ element.storeId }}</td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantity</th>
        <td mat-cell *matCellDef="let element">{{ element.quantity }}</td>
      </ng-container>

      <ng-container matColumnDef="supplier">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Supplier</th>
        <td mat-cell *matCellDef="let element">{{ element.supplier }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let element">
          <app-status-badge [status]="element.status || 'CREATED'"></app-status-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Timestamp</th>
        <td mat-cell *matCellDef="let element">{{ element.timestamp | date:'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <button mat-raised-button color="primary" class="btn-sm" (click)="submitReorderRequest(element.sku, element.storeId, element.quantity, element.supplier)">
            Re-trigger
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
