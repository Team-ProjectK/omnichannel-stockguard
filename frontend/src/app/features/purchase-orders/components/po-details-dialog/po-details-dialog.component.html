<h2 mat-dialog-title>Purchase Order {{ po.purchaseOrderNo }}</h2>
<mat-dialog-content>
  <div class="detail-grid">
    <div>
      <span class="label">Supplier Code</span>
      <div class="value">{{ po.supplierCode }}</div>
    </div>
    <div>
      <span class="label">SKU</span>
      <div class="value">{{ po.sku }}</div>
    </div>
    <div>
      <span class="label">Store ID</span>
      <div class="value">{{ po.storeId }}</div>
    </div>
    <div>
      <span class="label">Status</span>
      <div class="value">
        <app-status-badge [status]="po.status"></app-status-badge>
      </div>
    </div>
    <div>
      <span class="label">Quantity</span>
      <div class="value">{{ po.quantity }}</div>
    </div>
    <div>
      <span class="label">Unit Price</span>
      <div class="value">₹ {{ po.unitPrice | number }}</div>
    </div>
    <div>
      <span class="label">Total Amount</span>
      <div class="value font-bold">₹ {{ po.totalAmount | number }}</div>
    </div>
    <div *ngIf="po.orderDate">
      <span class="label">Order Date</span>
      <div class="value">{{ po.orderDate | date:'mediumDate' }}</div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="close()">Close</button>
</mat-dialog-actions>
