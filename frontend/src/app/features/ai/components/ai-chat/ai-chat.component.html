<div class="ai-chat-wrapper animate-fade-in">
  <div class="chat-card mat-elevation-z2">
    <!-- Chat Header -->
    <div class="chat-header">
      <div class="header-info">
        <mat-icon class="ai-icon">auto_awesome</mat-icon>
        <div>
          <h3>StockGuard AI Assistant</h3>
          <span class="status-indicator online">OpenRouter Gemini 2.5 Flash</span>
        </div>
      </div>
      <button mat-stroked-button color="warn" class="btn-clear" (click)="clearChat()">
        <mat-icon>cleaning_services</mat-icon> Clear Chat
      </button>
    </div>

    <!-- Messages Container -->
    <div class="chat-messages" #chatContainer>
      <div
        *ngFor="let msg of messages"
        class="message-row"
        [ngClass]="{ 'user-row': msg.sender === 'user', 'ai-row': msg.sender === 'ai' }">
        
        <div class="avatar" *ngIf="msg.sender === 'ai'">
          <mat-icon>smart_toy</mat-icon>
        </div>

        <div class="bubble" [ngClass]="{ 'user-bubble': msg.sender === 'user', 'ai-bubble': msg.sender === 'ai' }">
          <div class="message-content">{{ msg.text }}</div>
          <div class="message-footer">
            <span class="timestamp">{{ msg.timestamp | date:'shortTime' }}</span>
            <span *ngIf="msg.status === 'FALLBACK_SUCCESS'" class="error-badge">Database Rule Engine</span>
          </div>
        </div>

        <div class="avatar user-avatar" *ngIf="msg.sender === 'user'">
          <mat-icon>account_circle</mat-icon>
        </div>
      </div>

      <!-- Typing / Loading Animation Indicator -->
      <div *ngIf="isLoading" class="message-row ai-row">
        <div class="avatar"><mat-icon>smart_toy</mat-icon></div>
        <div class="bubble ai-bubble typing-bubble">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
          <span class="typing-text">AI is thinking...</span>
        </div>
      </div>
    </div>

    <!-- Input Footer Bar -->
    <div class="chat-input-bar">
      <mat-form-field appearance="outline" class="input-field">
        <input
          matInput
          placeholder="Ask AI about stock levels, reorder priorities, or pricing recommendations..."
          [(ngModel)]="userInput"
          (keyup.enter)="sendMessage()"
          [disabled]="isLoading" />
      </mat-form-field>
      <button
        mat-fab
        color="primary"
        class="send-btn"
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || isLoading">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
</div>
