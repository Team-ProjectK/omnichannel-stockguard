<h2 mat-dialog-title>{{ isEdit ? 'Edit Warehouse Facility' : 'Add Warehouse Facility' }}</h2>
<mat-dialog-content>
  <form [formGroup]="whForm" class="dialog-content">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Facility Code</mat-label>
        <input matInput formControlName="code">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Facility Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Location / City</mat-label>
        <input matInput formControlName="location">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Facility Manager</mat-label>
        <input matInput formControlName="manager">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Contact Phone</mat-label>
        <input matInput formControlName="phone">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Facility Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="Active">Active</mat-option>
          <mat-option value="Full">Full</mat-option>
          <mat-option value="Maintenance">Maintenance</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Total Capacity (Units)</mat-label>
        <input matInput formControlName="totalCapacity" type="number">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Used Space (Units)</mat-label>
        <input matInput formControlName="usedSpace" type="number">
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="whForm.invalid" (click)="onSubmit()">
    {{ isEdit ? 'Save Changes' : 'Add Facility' }}
  </button>
</mat-dialog-actions>
