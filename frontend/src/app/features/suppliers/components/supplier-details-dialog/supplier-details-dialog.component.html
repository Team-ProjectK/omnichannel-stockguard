<h2 mat-dialog-title>Supplier Details</h2>
<mat-dialog-content>
  <div class="detail-grid">
    <div>
      <span class="label">Supplier Name</span>
      <div class="value">{{ supplier.name }}</div>
    </div>
    <div>
      <span class="label">Category</span>
      <div class="value">{{ supplier.category }}</div>
    </div>
    <div>
      <span class="label">Contact Person</span>
      <div class="value">{{ supplier.contactPerson }}</div>
    </div>
    <div>
      <span class="label">Email</span>
      <div class="value">{{ supplier.email }}</div>
    </div>
    <div>
      <span class="label">Phone</span>
      <div class="value">{{ supplier.phone }}</div>
    </div>
    <div>
      <span class="label">Rating</span>
      <div class="rating">
        <mat-icon inline>star</mat-icon> {{ supplier.rating }} / 5.0
      </div>
    </div>
    <div>
      <span class="label">Status</span>
      <div class="value">
        <app-status-badge [status]="supplier.status"></app-status-badge>
      </div>
    </div>
    <div style="grid-column: span 2;">
      <span class="label">Address</span>
      <div class="value">{{ supplier.address }}</div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="close()">Close</button>
</mat-dialog-actions>
